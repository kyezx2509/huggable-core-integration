<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carregando…</title>
<meta name="robots" content="noindex">
<style>
html,body{height:100%;margin:0;background:#fff;font-family:system-ui,sans-serif}
.wrap{height:100%;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px}
</style>
</head>
<body>
<div class="wrap">Carregando…</div>
<script>
(function () {
  var qs = window.location.search || '';
  function go(path) { window.location.replace(path + qs); }

  var ua = navigator.userAgent || '';
  var isMobile = /Android|iPhone|iPod|Windows Phone|webOS|BlackBerry|Opera Mini|IEMobile/i.test(ua) ||
    (/iPad|Macintosh/.test(ua) && 'ontouchend' in document);

  if (!isMobile) { go('/artigo/'); return; }

  var tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  var lang = (navigator.language || '').toLowerCase();
  var brHints = /America\/(Sao_Paulo|Bahia|Fortaleza|Recife|Belem|Manaus|Cuiaba|Campo_Grande|Porto_Velho|Boa_Vista|Rio_Branco|Maceio|Araguaina|Santarem|Noronha|Eirunepe)/.test(tz) || lang.indexOf('pt') === 0;

  var done = false;
  function decide(country) {
    if (done) return; done = true;
    var isBR = country === 'BR' || (!country && brHints);
    go(isBR && brHints ? '/quiz/' : (isBR ? '/quiz/' : '/artigo/'));
  }

  var t = setTimeout(function () { decide(null); }, 2500);
  fetch('/api/public/geo', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { clearTimeout(t); decide(d && d.country ? String(d.country).toUpperCase() : null); })
    .catch(function () { clearTimeout(t); decide(null); });
})();
</script>
</body>
</html>
